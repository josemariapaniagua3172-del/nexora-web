# Configuración de Netlify — se publica la carpeta tal cual, sin compilar.
[build]
  publish = "."
  command = ""

# Archivos internos del proyecto: no se muestran en la web
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/marketing/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404"
  status = 404
  force = true

# Seguridad básica
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Las fotos y logos casi no cambian: el navegador los guarda una semana
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
